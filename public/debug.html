
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Auth Debugger 🔍</title>
    <style>
        :root {
            --primary: #4285F4;
            --success: #34A853;
            --error: #EA4335;
            --warning: #FBBC05;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }
        .status-card {
            border-left: 5px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .status-card.success { border-color: var(--success); background: #e6f4ea; }
        .status-card.error { border-color: var(--error); background: #fce8e6; }
        .status-card.warning { border-color: var(--warning); background: #fef7e0; }
        
        .label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        .value { font-family: monospace; word-break: break-all; font-size: 13px; color: #555; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
        .error-detail {
            font-size: 11px;
            background: #333;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Google Auth Debugger</h1>
        <div id="results">
            <p style="text-align: center;">กำลังโหลดข้อมูลการทดสอบ...</p>
        </div>
        <button class="btn" onclick="location.reload()">🔄 ทดสอบใหม่อีกครั้ง</button>
        <div class="footer">
            พัฒนาโดย DevGrok AI • โปรเจ็ค Income-Expense-by-Manus
        </div>
    </div>

    <script>
        async function runDebug() {
            const resultsDiv = document.getElementById('results');
            try {
                const response = await fetch('/api/debug-auth-data');
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                data.logs.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `status-card ${item.status}`;
                    card.innerHTML = `
                        <span class="label">${item.title}</span>
                        <span class="value">${item.message}</span>
                        ${item.detail ? `<div class="error-detail">${item.detail}</div>` : ''}
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<div class="status-card error"><span class="label">Error</span><span class="value">ไม่สามารถดึงข้อมูลจาก Server ได้</span></div>';
            }
        }
        runDebug();
    </script>
</body>
</html>
