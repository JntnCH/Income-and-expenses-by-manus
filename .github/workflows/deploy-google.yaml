name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main  # หรือชื่อกิ่งของคุณ เช่น master / develop

# 📌 1. กลุ่มค่ากำหนดพื้นฐาน (Environment Variables ระดับ Workflow)
env:
  PROJECT_ID: income-expenses-by-manus          # ID ของโปรเจกต์ GCP (เช่น income-expense-12345)
  REGION: asia-southeast1-docker.pkg.dev        # โซนเซิร์ฟเวอร์ (แนะนำ สิงคโปร์: asia-southeast1)
  SERVICE_NAME: income-expense-bot              # ชื่อบริการของ Cloud Run ที่จะสร้าง/อัปเดต
  GAR_LOCATION: asia-southeast1                 # ที่ตั้งของ Artifact Registry (มักจะเหมือน REGION)
  REPOSITORY: income-bot-repo                    # ชื่อคลังเก็บ Docker Image ใน Artifact Registry

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 2. กลุ่มการยืนยันตัวตน (Authentication)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }} # คีย์ JSON ของ Service Account จาก GCP

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    # 📌 3. ขั้นตอน Build และ Push (จุดที่เคยพังในรูปแรก)
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    # 📌 4. ขั้นตอนส่งขึ้น Cloud Run + แนบค่า Environment Variables (จากรูปที่สอง)
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        
