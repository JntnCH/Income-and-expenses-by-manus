name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO_NAME: income-bot-repo
  SERVICE_NAME: income-expense-bot
  REGISTRY_DOMAIN: asia-southeast1-docker.pkg.dev  # เพิ่มบรรทัดนี้

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY_DOMAIN }} --quiet

    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG="${{ env.REGISTRY_DOMAIN }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.IMAGE_TAG }}
        flags: '--allow-unauthenticated'
        env_vars: |
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GOOGLE_PRIVATE_KEY="${{ secrets.GOOGLE_PRIVATE_KEY }}"
          GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID }}
          MONTHLY_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID }}
          DEBT_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID }}