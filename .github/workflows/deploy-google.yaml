name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

# 📌 1. กลุ่มค่ากำหนดพื้นฐาน (ปรับ REGION ให้ถูกต้อง)
env:
  PROJECT_ID: income-expenses-by-manus          
  REGION: asia-southeast3                       # แก้ตรงนี้เป็นแค่ชื่อ Region ของ Cloud Run
  SERVICE_NAME: income-expense-docker          
  GAR_LOCATION: asia-southeast3                 
  REPOSITORY: income-expense-docker           

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 2. กลุ่มการยืนยันตัวตน (Authentication)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }} 

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    # 📌 3. ขั้นตอน Build และ Push (ปรับให้ต่อ String URL ของ Registry แทน)
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    # 📌 4. ขั้นตอนส่งขึ้น Cloud Run + แนบค่า Environment Variables
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        
        # ใส่ค่าให้ครบถ้วนตามรูปแบบด้านล่างนี้ครับ
        env_vars: |
          NODE_ENV=production
          GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SPREADSHEET_ID="1yPNCTj0RF9GHcOIuwLyqKECSIwF8oQ4cr2BVBidzFdU"
          MONTHLY_SPREADSHEET_ID="16gOMnohl7v9RPTTqhHtJlMV6U65OJSiKDu02DIPdEwg"
          DEBT_SPREADSHEET_ID="1FENTWNHjQIGBQ-GWjPhV7qf8Yh7Qdk2MqPMzRVeyZX0"
          GOOGLE_SHEET_NAME=รายรับ-รายจ่าย
          GOOGLE_INVEST_SHEET_NAME=การลงทุน
          GOOGLE_BOTDASHBOARD_SHEET_NAME=BotDashboard
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DIALOGFLOW_PROJECT_ID=income-expenses-by-manus
          OCR_PROVIDER=google
          IAPP_API_KEY=${{ secrets.IAPP_API_KEY }}
          APPMAN_API_KEY=${{ secrets.APPMAN_API_KEY }}
