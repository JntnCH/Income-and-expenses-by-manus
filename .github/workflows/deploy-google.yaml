name: Deploy to Cloud Run
on:
push:
branches:
- main  # หรือ master ตามชื่อ branch หลักของคุณ
env:
PROJECT_ID: income-expenses-by-manus
SERVICE_NAME: income-expense-docker
REGION: asia-southeast3
GAR_LOCATION: asia-southeast3
REPOSITORY: income-expense-frombot  # เปลี่ยนเป็นชื่อ Artifact Registry Repository ของคุณ
IMAGE_NAME: income-expense-frombot
jobs:
deploy:
runs-on: ubuntu-latest
steps:
- name: 📥 Checkout Repository
uses: actions/checkout@v4
- name: 🔑 Authenticate to Google Cloud
uses: google-github-actions/auth@v2
with:
credentials_json: ${{ secrets.GCP_SA_KEY }}
- name: 🐳 Set up Docker Buildx (Layer Caching)
uses: docker/setup-buildx-action@v3
- name: 🔐 Log in to Google Artifact Registry
uses: docker/login-action@v3
with:
registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
username: _json_key
password: ${{ secrets.GCP_SA_KEY }}
- name: 🏗️ Build and Push Docker Image with Cache
uses: docker/build-push-action@v5
with:
context: .
push: true
tags: ￼{{ env.PROJECT_ID }}/￼{{ env.IMAGE_NAME }}:${{ github.sha }}
cache-from: type=gha
cache-to: type=gha,mode=max
- name: 🚀 Deploy to Cloud Run
uses: google-github-actions/deploy-cloudrun@v3
with:
service: ￼
￼
￼{{ env.IMAGE_NAME }}:${{ github.sha }}
flags: >-
--allow-unauthenticated
--port=8080
--min-instances=0
--service-account="income-expenses-by-manus@appspot.gserviceaccount.com"
env_vars: |
NODE_ENV=production
CORS_ORIGINS=https://income-and-expenses-by-manus.vercel.app,https://income-expense-docker-274212739997.asia-southeast3.run.app
DIALOGFLOW_PROJECT_ID=income-expenses-by-manus
OCR_PROVIDER=google
GOOGLE_SHEET_NAME=GOOGLE_SHEET_NAME
GOOGLE_INVEST_SHEET_NAME=GOOGLE_INVEST_SHEET_NAME
GOOGLE_BOTDASHBOARD_SHEET_NAME=GOOGLE_BOTDASHBOARD_SHEET_NAME
secrets: |
ADMIN_API_KEY=ADMIN_API_KEY:latest
DIALOGFLOW_WEBHOOK_SECRET=DIALOGFLOW_WEBHOOK_SECRET:latest
GOOGLE_SPREADSHEET_ID=GOOGLE_SPREADSHEET_ID:latest
MONTHLY_SPREADSHEET_ID=MONTHLY_SPREADSHEET_ID:latest
DEBT_SPREADSHEET_ID=DEBT_SPREADSHEET_ID:latest
TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest
MY_TELEGRAM_CHAT_ID=MY_TELEGRAM_CHAT_ID:latest
OPENAI_API_KEY=OPENAI_API_KEY:latest
IAPP_API_KEY=IAPP_API_KEY:latest
APPMAN_API_KEY=APPMAN_API_KEY:latest
- name: 📊 Deployment Complete
run: |
echo "✅ Cloud Run service deployed successfully!"